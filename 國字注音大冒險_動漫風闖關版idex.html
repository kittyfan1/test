  /* 背景動態漂浮注音與國字裝飾 */
  .bg-decorations {

    height: 100%;

  .floating-char {

    font-weight: bold;

    animation: floatUp 16s infinite linear;
  }

  @keyframes floatUp {
    0% { transform: translateY(105vh) rotate(0deg); opacity: 0; }

    90% { opacity: 0.25; }
    100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }

  /* 頂部動漫 Banner */

  /* 導航功能按鈕列 */

  .anime-option-btn:active:not(:disabled) {

    box-shadow: 0 3px 0 #0284c7;
  }

  .opt-badge {

  .opt-text {

  /* 點擊正確/錯誤回饋 */

  .anime-option-btn.wrong-glow .opt-badge {
    background: var(--error) !important;
  }

  /* 底部解說與小助手對話框 */
  .helper-dialog-box {
    margin-top: 20px;

  .bot-avatar {

    background: #ffffff;
    border: 3px solid #38bdf8;

  .dialog-bubble {

  /* 下一題按鈕 */
  .btn-next-action {

  .btn-next-action:hover {

  /* 頁面切換控制 */

  /* 結算頁面風格 */

<body>

<!-- 背景動態漂浮國字注音 -->
<div class="bg-decorations" id="bg-decorations"></div>

<!-- 頂部動漫風大標題與功能按鈕導航 -->
<header class="anime-banner">
  <div class="banner-title-box">
    <div class="banner-title">✨ 國字注音大冒險 ✨</div>
  </div>
  
  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('home')">🏠 首頁</button>
    <button class="tab-btn" onclick="startAdventure(20, 'all')">📖 單元練習 (20題)</button>
    <button class="tab-btn" onclick="openNotebookView()">📘 我的錯題本</button>
    <button class="tab-btn" onclick="startRetestMode()">🎒 自行補考</button>
  </div>
</header>

<main class="main-stage">
  
  <!-- 1. 首頁/選單面板 -->
  <section id="view-home" class="view-panel active">
    <div class="game-board" style="text-align: center; color: white;">
      <div class="mascot-avatar">🦊</div>
      <h2 style="font-size: 34px; margin-top: 15px; letter-spacing: 2px; color: #fef08a;">冒險者，準備好挑戰了嗎？</h2>
      <p style="font-size: 22px; margin: 15px 0 25px; line-height: 1.7;">
        每次測驗將由題庫隨機抽取 <strong>20 題</strong>！<br>
        答錯時智慧助手機構將立即為你解說，並收錄至專屬「錯題本」。
      </p>
      
      <div style="display: flex; justify-content: center; gap: 15px; flex-wrap: wrap;">
        <button class="btn-next-action" style="font-size: 26px; padding: 14px 42px;" onclick="startAdventure(20, 'all')">🚀 開始 20 題冒險闖關</button>
        <button class="btn-next-action" style="background: linear-gradient(180deg, #0284c7 0%, #0369a1 100%); border-color: #7dd3fc;" onclick="startAdventure(15, 'pronunciation')">🎯 專項：看國字選注音</button>
        <button class="btn-next-action" style="background: linear-gradient(180deg, #0284c7 0%, #0369a1 100%); border-color: #7dd3fc;" onclick="startAdventure(15, 'character')">🎯 專項：看注音選國字</button>
      </div>
    </div>
  </section>

  <!-- 2. 作答進行中面板 (完全仿造動漫圖風格) -->
  <section id="view-quiz" class="view-panel">
    <div class="game-board">
      <!-- 左上方吉祥物小狐狸 -->
      <div class="mascot-avatar">🦊</div>
      
      <!-- 題型標籤 -->
      <div id="q-stage-tag" class="stage-tag">看國字選注音</div>

      <!-- 題目卡片 -->
      <div class="question-card">
        <div id="q-text-prompt" class="question-prompt">「<span class="question-highlight">娓娓</span>」道來</div>
      </div>

      <!-- 四個卡通角色選項按鈕 -->
      <div id="options-box" class="options-container">
        <!-- 動態渲染選項 -->
      </div>

      <!-- 底部錯題解說與機器人對話框 -->
      <div id="helper-feedback-box" class="helper-dialog-box">
        <div class="bot-avatar">🤖</div>
        <div class="dialog-bubble">
          <div id="feedback-title" style="font-weight: bold; font-size: 22px;"></div>
          <div id="feedback-exp-content" class="explanation-card"></div>
          <div style="text-align: right;">
            <button class="btn-next-action" onclick="nextQuestion()">下一題 👉</button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- 3. 結算畫面 -->
  <section id="view-result" class="view-panel">
    <div class="game-board">
      <div class="result-box">
        <h2 style="font-size: 36px; color: #0284c7;">🎉 闖關成果結算 🎉</h2>
        <div class="result-score"><span id="res-score">100</span> <span style="font-size: 32px;">分</span></div>
        <p style="font-size: 24px; margin-bottom: 15px;">
          本次挑戰 20 題，答對 <span id="res-correct" style="color: var(--success); font-weight: bold;">0</span> 題，答錯 <span id="res-wrong" style="color: var(--error); font-weight: bold;">0</span> 題。
        </p>

        <!-- 錯題清單展示 -->
        <div id="result-wrong-box" style="display: none;">
          <h3 style="font-size: 24px; color: #b91c1c; text-align: left; margin: 15px 0 8px;">❌ 本回合錯題精析紀錄：</h3>
          <div id="result-wrong-items" class="wrong-card-list"></div>
        </div>

        <div style="margin-top: 25px; display: flex; justify-content: center; gap: 15px; flex-wrap: wrap;">
          <button id="btn-retest-action" class="btn-next-action" style="background: linear-gradient(180deg, #d97706 0%, #b45309 100%);" onclick="startRetestMode()">🎒 錯題立即補考</button>
          <button class="btn-next-action" onclick="startAdventure(20, 'all')">🔄 再玩一次 (新 20 題)</button>
          <button class="btn-next-action" style="background: #0284c7;" onclick="switchTab('home')">🏠 回到主頁</button>
        </div>
      </div>
    </div>
  </section>

  <!-- 4. 我的錯題本面板 -->
  <section id="view-notebook" class="view-panel">
    <div class="game-board">
      <div class="result-box">
        <h2 style="font-size: 34px; color: #0369a1;">📘 我的自主訂正錯題本</h2>
        <p style="font-size: 20px; color: #64748b; margin: 10px 0 20px;">累積所有練習中答錯的題目，隨時可自主複習與補考！</p>
        <div id="notebook-items-container" class="wrong-card-list" style="max-height: 480px;"></div>
        
        <div style="margin-top: 20px;">
          <button class="btn-next-action" onclick="startRetestMode()">🎒 對錯題本進行自主補考</button>
          <button class="btn-next-action" style="background: #0284c7;" onclick="switchTab('home')">🏠 返回首頁</button>
        </div>
      </div>
    </div>
  </section>

</main>

<script>
// 題庫資料（包含題目、正確解答、誘答選項、角色頭貼、詳解）
const QUESTION_BANK = [
  {
    id: 1,
    type: 'pronunciation',
    prompt: "「娓娓」道來",
    highlight: "娓娓",
    answer: "ㄇㄟˇ",
    options: ["ㄇㄟˇ", "ㄨㄟˇ", "ㄋㄧˇ", "ㄇㄧˇ"],
    explanation: "【娓娓道來】：音「ㄇㄟˇ ㄇㄟˇ ㄉㄠˋ ㄌㄞˊ」。形容說話生動動聽且連續不斷。常被誤讀為ㄨㄟˇ。"
  },
  {
    id: 2,
    type: 'pronunciation',
    prompt: "「彳」亍",
    highlight: "彳",
    answer: "ㄔˋ",
    options: ["ㄔˋ", "ㄔㄨˋ", "ㄒㄧㄥˊ", "ㄔ"],
    explanation: "【彳亍】：音「ㄔˋ ㄔㄨˋ」。「彳」為第四聲ㄔˋ，形容慢步行走。"
  },
  {
    id: 3,
    type: 'pronunciation',
    prompt: "彳「亍」",

// 動漫卡通頭像池
const ANIME_AVATARS = ['👧', '👦', '👧🏻', '👦🏻', '🧒', '👧🏼'];

// 狀態管理
let currentQuizList = [];
let currentIndex = 0;
let roundWrongList = [];
let masterNotebook = []; // 累積錯題本
let correctCount = 0;
let isAnswered = false;

// 隨機洗牌
function shuffle(arr) {
  const res = [...arr];
  for (let i = res.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [res[i], res[j]] = [res[j], res[i]];
  }
  return res;
}

// 動態背景字元生成
function initBackgroundDecorations() {
  const chars = ['ㄅ','ㄆ','ㄇ','ㄈ','ㄉ','ㄊ','ㄋ','ㄌ','ㄍ','ㄎ','ㄏ','ㄐ','ㄑ','ㄒ','娓','亍','雋','瀲','窒','櫛','稚','憩','迂','裕','訥'];
  const container = document.getElementById('bg-decorations');
  for(let i = 0; i < 24; i++) {
    const span = document.createElement('span');
    span.className = 'floating-char';
    span.innerText = chars[Math.floor(Math.random() * chars.length)];
    span.style.left = `${Math.random() * 95}vw`;
    span.style.animationDelay = `${Math.random() * 15}s`;
    span.style.animationDuration = `${12 + Math.random() * 8}s`;
    container.appendChild(span);
  }
}
initBackgroundDecorations();

// 導航切換
function switchTab(viewName) {
  document.querySelectorAll('.view-panel').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  
  const targetView = document.getElementById(`view-${viewName}`);
  if (targetView) targetView.classList.add('active');
}

// 開始闖關測驗
function startAdventure(count = 20, mode = 'all') {
  let pool = [...QUESTION_BANK];
  if (mode === 'pronunciation') pool = pool.filter(q => q.type === 'pronunciation');
  if (mode === 'character') pool = pool.filter(q => q.type === 'character');

  currentQuizList = shuffle(pool).slice(0, Math.min(count, pool.length));
  currentIndex = 0;
  correctCount = 0;
  roundWrongList = [];

  switchTab('quiz');
  renderQuestion();
}

// 渲染當前題目
function renderQuestion() {
  isAnswered = false;
  const q = currentQuizList[currentIndex];
  
  document.getElementById('q-stage-tag').innerText = 
    `第 ${currentIndex + 1} / ${currentQuizList.length} 關 ‧ ${q.type === 'pronunciation' ? '看國字選注音' : '看注音選國字'}`;
  
  // 替換反白高亮區域
  const formattedPrompt = q.prompt.replace(`「${q.highlight}」`, `「<span class="question-highlight">${q.highlight}</span>」`);
  document.getElementById('q-text-prompt').innerHTML = formattedPrompt;

  // 隨機排列四個選項
  const shuffledOpts = shuffle(q.options);
  const labels = ['A', 'B', 'C', 'D'];
  const optBox = document.getElementById('options-box');
  optBox.innerHTML = '';

  shuffledOpts.forEach((opt, idx) => {
    const btn = document.createElement('button');
    btn.className = 'anime-option-btn';
    btn.dataset.val = opt;
    btn.onclick = () => handleSelectOption(opt, btn);
    btn.innerHTML = `
      <div class="opt-badge">${labels[idx]}</div>
      <div class="opt-text">${opt}</div>
      <div class="opt-avatar">${ANIME_AVATARS[idx % ANIME_AVATARS.length]}</div>
    `;
    optBox.appendChild(btn);
  });

  document.getElementById('helper-feedback-box').style.display = 'none';
}

// 處理點選答案
function handleSelectOption(chosenVal, chosenBtn) {
  if (isAnswered) return;
  isAnswered = true;

  const q = currentQuizList[currentIndex];
  const isCorrect = (chosenVal === q.answer);
  const allButtons = document.querySelectorAll('.anime-option-btn');

  allButtons.forEach(btn => {
    btn.disabled = true;
    if (btn.dataset.val === q.answer) {
      btn.classList.add('correct-glow');
    }
  });

  const feedbackBox = document.getElementById('helper-feedback-box');
  const feedbackTitle = document.getElementById('feedback-title');
  const feedbackExp = document.getElementById('feedback-exp-content');

  feedbackBox.style.display = 'flex';

  if (isCorrect) {
    correctCount++;
    feedbackTitle.innerHTML = `<span style="color: var(--success);">🎉 太厲害了！回答完全正確！</span>`;
  } else {
    chosenBtn.classList.add('wrong-glow');
    feedbackTitle.innerHTML = `<span style="color: var(--error);">❌ 哎呀答錯了！你選的是【${chosenVal}】，正解是【${q.answer}】</span>`;
    
    // 加入本輪錯題
    const wrongData = { ...q, userAnswer: chosenVal };
    roundWrongList.push(wrongData);

    // 同步記錄至總錯題本（不重複）
    if (!masterNotebook.some(item => item.id === q.id)) {
      masterNotebook.push(wrongData);
    }
  }

  feedbackExp.innerHTML = `<strong>💡 冒險重點精解：</strong>${q.explanation}`;
}

// 下一題
function nextQuestion() {
  currentIndex++;
  if (currentIndex < currentQuizList.length) {
    renderQuestion();
  } else {
    showResultStage();
  }
}

// 結算畫面
function showResultStage() {
  switchTab('result');
  const total = currentQuizList.length;
  const score = Math.round((correctCount / total) * 100);

  document.getElementById('res-score').innerText = score;
  document.getElementById('res-correct').innerText = correctCount;
  document.getElementById('res-wrong').innerText = roundWrongList.length;

  const wrongBox = document.getElementById('result-wrong-box');
  const wrongItems = document.getElementById('result-wrong-items');
  const retestBtn = document.getElementById('btn-retest-action');

  if (roundWrongList.length > 0) {
    wrongBox.style.display = 'block';
    retestBtn.style.display = 'inline-flex';
    wrongItems.innerHTML = roundWrongList.map((item, idx) => `
      <div class="wrong-item-row">
        <div><strong>第 ${idx + 1} 題：</strong>${item.prompt}</div>
        <div style="margin: 4px 0;">
          <span style="color: var(--error); font-weight: bold;">你的選擇：${item.userAnswer}</span>
          <span style="color: var(--success); font-weight: bold; margin-left: 12px;">✓ 正確答案：【${item.answer}】</span>
        </div>
        <div style="font-size: 18px; color: #475569;">解析：${item.explanation}</div>
      </div>
    `).join('');
  } else {
    wrongBox.style.display = 'none';
    retestBtn.style.display = 'none';
  }
}

// 查看累積錯題本
function openNotebookView() {
  switchTab('notebook');
  const container = document.getElementById('notebook-items-container');
  if (masterNotebook.length === 0) {
    container.innerHTML = `<div style="padding: 30px; font-size: 22px; color: #64748b;">✨ 目前沒有錯題紀錄！代表你的國字注音非常厲害喔！</div>`;
  } else {
    container.innerHTML = masterNotebook.map((item, idx) => `
      <div class="wrong-item-row">
        <div><strong>【錯題 ${idx + 1}】</strong>${item.prompt}</div>
        <div style="color: var(--success); font-weight: bold; margin: 4px 0;">✓ 正確答案：【${item.answer}】</div>
        <div style="font-size: 18px; color: #475569;">精解：${item.explanation}</div>
      </div>
    `).join('');
  }
}

// 錯題補考模式
function startRetestMode() {
  const targetList = roundWrongList.length > 0 ? roundWrongList : masterNotebook;
  if (!targetList || targetList.length === 0) {
    alert("目前沒有錯題需要補考喔！可以直接進行 20 題綜合練習！");
    startAdventure(20, 'all');
    return;
  }

  currentQuizList = shuffle(targetList);
  currentIndex = 0;
  correctCount = 0;
  roundWrongList = [];

  switchTab('quiz');
  renderQuestion();
}

// 支援鍵盤快速鍵 1/2/3/4 或 A/B/C/D
document.addEventListener('keydown', (e) => {
  if (!isAnswered) {
    const key = e.key.toUpperCase();
    const btns = document.querySelectorAll('.anime-option-btn');
    if (['A', '1'].includes(key) && btns[0]) btns[0].click();
    if (['B', '2'].includes(key) && btns[1]) btns[1].click();
    if (['C', '3'].includes(key) && btns[2]) btns[2].click();
    if (['D', '4'].includes(key) && btns[3]) btns[3].click();
  } else if (e.key === 'Enter') {
    const helper = document.getElementById('helper-feedback-box');
    if (helper.style.display !== 'none') {
      nextQuestion();
    }
  }
});
</script>
